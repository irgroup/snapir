[project]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "httpx>=0.28.1",
  "langchain-openai>=1.7.2",
  "matplotlib>=3.11.2",
  "pandas>=3.1.0",
  "pillow>=13.0.0",
  "playwright>=1.64.1",
  "playwright-stealth>=2.0.3",
  "protego>=0.7.0",
  "pymupdf>=1.28.0",
  "pypdf[crypto]>=6.21.2",
  "serpapi>=1.1.2",
  "tqdm>=4.70.1",
  "trafilatura>=2.3.1",
  "typer>=0.26.7",
]
description = "Toolkit for temporal information retrieval datasets"
name = "snapir"
readme = "README.md"
requires-python = ">=3.11"
version = "0.1.1"

[project.optional-dependencies]
tests = [
  "pytest",
  "pytest-cov",
  "ruff>=0.17.3",
  "mypy",
  "bandit[toml]",
]
gemini = ["langchain-google-genai"]
prefect = [
  "prefect>=3.4",
]

[project.scripts]
snapir = "snapir.cli.app:main"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/snapir"]

[tool.hatch.build]
exclude = [
  "/examples",
  "/data",
  "/workflows",
]

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
ignore = ["E501", "B905"]
select = ["E", "F", "W", "I", "B"]

[dependency-groups]
dev = [
  "ruff>=0.17.3",
]
